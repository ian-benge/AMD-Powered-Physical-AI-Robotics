bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: drive_center  # the launch file sets frame and footprints from core.FOOTPRINT
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    default_nav_to_pose_bt_xml: ''
controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /odom
    controller_frequency: 20.0
    failure_tolerance: 3.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.087
      trans_stopped_velocity: 0.02
      rot_stopped_velocity: 0.02
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.10
      regulated_linear_scaling_min_speed: 0.03
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.3
      max_angular_accel: 1.0
      use_rotate_to_heading: true
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      transform_tolerance: 0.2
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: drive_center
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.025
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.2
      track_unknown_space: true
      footprint: '[[0.07,0.17],[0.07,-0.17],[-0.33,-0.17],[-0.33,0.17]]'
      footprint_padding: 0.025
      plugins: [ground, inflation]
      ground:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /navigation/local_ground
        map_subscribe_transient_local: false
        subscribe_to_updates: false
        footprint_clearing_enabled: false
        lethal_cost_threshold: 90
        trinary_costmap: false
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflate_around_unknown: true
        inflation_radius: 0.45
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: drive_center
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 1.0
      track_unknown_space: true
      footprint: '[[0.07,0.17],[0.07,-0.17],[-0.33,-0.17],[-0.33,0.17]]'
      footprint_padding: 0.025
      plugins: [ground, inflation]
      ground:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /navigation/terrain_map
        map_subscribe_transient_local: true
        footprint_clearing_enabled: false
        lethal_cost_threshold: 90
        trinary_costmap: false
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflate_around_unknown: true
        inflation_radius: 0.45
        cost_scaling_factor: 5.0
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerLattice
      lattice_filepath: ''
      allow_unknown: false
      allow_reverse_expansion: false
      tolerance: 0.15
      max_planning_time: 3.0
      cost_penalty: 2.0
      rotation_penalty: 1.0
      analytic_expansion_max_length: 1.0
      smooth_path: true
