name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/run_checks.py --output-dir outputs/source-checks
      - run: node src/rover_perception/test/test_live_controls.cjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: source-checks-${{ matrix.os }}
          path: outputs/source-checks/
          retention-days: 14
