name: ROS build
on:
  push:
    branches: [main]
    paths: ['src/**', 'docker/**', '.github/workflows/ros-build.yml']
  pull_request:
    paths: ['src/**', 'docker/**', '.github/workflows/ros-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  jazzy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build Jazzy and navigation images
        run: |
          set -euo pipefail
          # The navigation image inherits the base image's apt sources.
          # Retry both builds with an independent mirror if either fails.
          for mirror in https://archive.ubuntu.com/ubuntu https://ubuntu.osuosl.org/ubuntu; do
            echo "Building ROS images with $mirror"
            if docker build --network host --build-arg UBUNTU_MIRROR="$mirror" \
                -f docker/Dockerfile.jazzy -t rover-jazzy . &&
              docker build --network host -f docker/Dockerfile.navigation -t rover-navigation .; then
              exit 0
            fi
            echo "::warning::ROS image build failed using $mirror"
          done
          echo '::error::ROS image builds failed with both Ubuntu mirrors'
          exit 1
      - name: Build ROS packages
        run: |
          docker run --rm -v "$PWD:/work" -w /work rover-navigation bash -c '
            set -e
            source /opt/ros/jazzy/setup.bash
            colcon --log-base log_navigation build --base-paths src \
              --build-base build_navigation --install-base install_navigation \
              --packages-up-to rover_navigation
          '
      - name: Check installed demo service and best-effort odometry
        run: |
          set -euo pipefail
          mkdir -p outputs/ros-checks
          docker run --rm --network none \
            -e ROS_DOMAIN_ID=88 -e ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST \
            -v "$PWD:/work" -w /work rover-navigation bash -c '
              set -e
              source /opt/ros/jazzy/setup.bash
              source /work/install_navigation/setup.bash
              python3 scripts/probe_autonomous_demo.py
            ' 2>&1 | tee outputs/ros-checks/demo-service.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ros-checks
          path: outputs/ros-checks/
          retention-days: 14
